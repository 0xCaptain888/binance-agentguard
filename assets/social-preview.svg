<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Binance AgentGuard</title>
  <desc id="description">Policy-gated Binance AI Agent execution with verified, blocked, and frozen outcomes.</desc>
  <defs>
    <radialGradient id="background" cx="0" cy="0" r="1" gradientTransform="translate(190 20) rotate(27) scale(850 580)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17345e"/>
      <stop offset="1" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6cc5ff"/>
      <stop offset="1" stop-color="#48e0a8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#02050a" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1120" cy="-20" r="280" fill="#17304b" opacity=".45"/>
  <circle cx="1170" cy="560" r="220" fill="#10352f" opacity=".3"/>

  <g transform="translate(72 60)">
    <rect width="58" height="58" rx="17" fill="url(#accent)"/>
    <path d="M17 41 29 14l12 27h-7l-2-6H25l-2 6Zm10-12h4l-2-7Z" fill="#06111a"/>
    <text x="76" y="39" fill="#f4f7fb" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="750">Binance AgentGuard</text>
    <text x="76" y="62" fill="#9aa8bd" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" letter-spacing="2">BINANCE AGENT OS · TRACK A</text>
  </g>

  <text x="72" y="225" fill="#f4f7fb" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="68" font-weight="800" letter-spacing="-3">Agents can act.</text>
  <text x="72" y="300" fill="url(#accent)" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="68" font-weight="800" letter-spacing="-3">Guardrails decide.</text>
  <text x="74" y="354" fill="#b4c0d2" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23">Policy gate → Binance Spot → independent verification → receipt + hash</text>

  <g transform="translate(72 406)" filter="url(#shadow)">
    <rect width="350" height="122" rx="20" fill="#111827" stroke="#263246"/>
    <rect x="24" y="23" width="104" height="30" rx="15" fill="#12382f"/>
    <text x="76" y="44" text-anchor="middle" fill="#35d49a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="1">VERIFIED</text>
    <text x="24" y="83" fill="#f4f7fb" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="720">Safe result released</text>
    <text x="24" y="106" fill="#9aa8bd" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">Real BNBUSDT order independently checked</text>
  </g>
  <g transform="translate(455 406)" filter="url(#shadow)">
    <rect width="350" height="122" rx="20" fill="#111827" stroke="#263246"/>
    <rect x="24" y="23" width="98" height="30" rx="15" fill="#3c3014"/>
    <text x="73" y="44" text-anchor="middle" fill="#ffc857" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="1">BLOCKED</text>
    <text x="24" y="83" fill="#f4f7fb" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="720">Stopped pre-trade</text>
    <text x="24" y="106" fill="#9aa8bd" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">Budget or policy violation; no order sent</text>
  </g>
  <g transform="translate(838 406)" filter="url(#shadow)">
    <rect width="350" height="122" rx="20" fill="#111827" stroke="#263246"/>
    <rect x="24" y="23" width="92" height="30" rx="15" fill="#3d1e28"/>
    <text x="70" y="44" text-anchor="middle" fill="#ff6b7a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="1">FROZEN</text>
    <text x="24" y="83" fill="#f4f7fb" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="720">Failed closed</text>
    <text x="24" y="106" fill="#9aa8bd" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">Unsafe execution result isolates the task</text>
  </g>

  <text x="72" y="592" fill="#73829a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">github.com/0xCaptain888/binance-agentguard</text>
  <text x="1208" y="592" text-anchor="end" fill="#73829a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">v0.1.1</text>
</svg>
