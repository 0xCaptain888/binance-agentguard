name: Bug report
description: Report a reproducible AgentGuard defect without sharing credentials.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include API keys, OAuth tokens, private keys, passphrases, or unredacted account data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.1 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Execution path
      options:
        - Deterministic demo
        - Public evidence verifier
        - Read-only Binance MCP runner
        - Explicit live write path
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest credential-free reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
