name: Feature request
description: Suggest a policy, verification, evidence, or Binance integration improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What agent execution risk or judge workflow does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: dropdown
    id: safety
    attributes:
      label: Does this introduce a Binance write operation?
      options:
        - No
        - Yes, with explicit confirmation
        - Unsure
    validations:
      required: true
